name: Apply portfolio refresh
on:
  push:
    paths:
      - 'scripts/refresh_portfolio.py'
      - '.github/workflows/portfolio-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refresh HTML in place
        run: python scripts/refresh_portfolio.py
      - name: Commit refreshed portfolio
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply elegant portfolio redesign and Gym Helper card"
            git push
          fi
